name: Release macOS app

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Build and package universal app
        run: bash Scripts/package-release.sh "$RUNNER_TEMP/FiSiTrainer-Release" "$RELEASE_TAG"
      - name: Upload DMG and checksum to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/FiSiTrainer-Release/FiSiTrainer-$RELEASE_TAG-macOS-universal.dmg" \
            "$RUNNER_TEMP/FiSiTrainer-Release/FiSiTrainer-$RELEASE_TAG-macOS-universal.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
