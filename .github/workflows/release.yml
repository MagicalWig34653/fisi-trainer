name: Release macOS app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.0 (must not exist yet)"
        required: true
        type: string
      title:
        description: "Release title (default: FiSi Trainer <version>)"
        required: false
        type: string
      notes:
        description: "Release notes in Markdown (default: generated notes)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Manual start only: creates the tag and release on main. A release created with the workflow
  # token does not trigger the "published" event, so packaging runs in this same workflow.
  create-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vMAJOR.MINOR.PATCH, got: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
                --title "${RELEASE_TITLE:-FiSi Trainer ${RELEASE_TAG#v}}")
          if [[ -n $RELEASE_NOTES ]]; then
            args+=(--notes "$RELEASE_NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"

  package:
    needs: [create-release]
    if: ${{ !cancelled() && (github.event_name == 'release' || needs.create-release.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Build and package universal app
        run: bash Scripts/package-release.sh "$RUNNER_TEMP/FiSiTrainer-Release" "$RELEASE_TAG"
      - name: Upload DMG and checksum to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/FiSiTrainer-Release/FiSiTrainer-$RELEASE_TAG-macOS-universal.dmg" \
            "$RUNNER_TEMP/FiSiTrainer-Release/FiSiTrainer-$RELEASE_TAG-macOS-universal.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # If packaging fails after a manual start, remove the release this run just created so no
  # release without a download remains. The tag was verified not to exist before creation.
  rollback:
    needs: [create-release, package]
    if: ${{ failure() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete incomplete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
